<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一趟跑完 · 排好今天的路线</title><link rel="stylesheet" href="/web/styles.css"><script defer src="/web/common.js"></script><script defer src="/web/input.js"></script></head>
<body><header><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">↗</span>一趟跑完</a><span class="tag">一天的路，顺着走</span></header>
<main><div id="mode-banner" class="banner" hidden></div><nav class="steps" aria-label="规划步骤"><strong>01 输入地点</strong><span>02 确认位置</span><span>03 查看路线</span></nav>
<section class="intro"><div class="eyebrow">A DAY, WELL PLANNED</div><h1>一天跑 6 个地方，<br>怎么走最顺？</h1><p class="lead">告诉我你想去哪，把时间留给路上的风景。</p></section>
<div id="error" class="error" role="alert" tabindex="-1" hidden></div><div class="layout"><div><section class="panel"><label for="sentence" class="field-label">先说说你的行程</label><textarea id="sentence" maxlength="3000" placeholder="从杭州出发，想去乌镇、西塘古镇、南浔古镇，最后到上海"></textarea><div class="actions"><button id="parse" type="button">填入地点 ↓</button><button id="example" class="text-button" type="button">试试杭州 → 上海示例</button></div><p class="small">支持上面的简单句式，也可以直接填写下面的地点。</p></section>
<form id="trip-form" class="panel"><h2>这些地方，都想去</h2><div class="row"><label><span>从哪里出发</span><input id="start" maxlength="200" required placeholder="起点名称或地址"></label><label><span>城市（可选）</span><input id="start-city" maxlength="100" placeholder="如杭州"></label></div>
<div class="section-head"><h3>想去的地方 <span id="count" class="small"></span></h3><button id="add" type="button" class="text-button">＋ 添加一站</button></div><p class="small">3–8 个途经点，先按你想到的顺序填写。</p><div id="waypoints"></div>
<hr class="divider"><label for="end-mode" class="field-label">这一天在哪里结束</label><select id="end-mode"><option value="fixed">在指定地点结束</option><option value="open">走完这些地方即可</option><option value="roundtrip">回到出发点</option></select><div id="end-fields" class="row" style="margin-top:12px"><label><span>终点</span><input id="end" maxlength="200" required placeholder="终点名称或地址"></label><label><span>城市（可选）</span><input id="end-city" maxlength="100" placeholder="如上海"></label></div>
<div class="section-head"><label for="objective" class="field-label">更在意什么</label></div><select id="objective"><option value="fastest">少花时间 · 最快顺序</option><option value="shortest">少绕路 · 最短距离</option></select>
<div class="actions"><button id="submit" class="primary wide" type="submit">下一步，确认地点 →</button></div><div id="loading" class="loading" role="status" hidden>正在保存你的行程…</div></form></div>
<aside class="side-note"><div class="rule"></div><h3>先确认地点，再认真排路。</h3><p>同名的古镇、车站、入口可能相隔很远。下一步会展示具体地址，由你选定。</p><p>我们比较实际驾车成本，保留所有想去的地方，只调整访问顺序。</p><div class="note">只计算路上驾驶时间，不含游玩、停车和休息。</div></aside></div></main><footer>一趟跑完 · 先去哪，后去哪，一起排明白。</footer></body></html>
